name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

# Documentation generation was removed: `leanprover-community/docgen-action` deploys to GitHub
# Pages, which requires the Pages source to be set to "GitHub Actions" in the repository
# settings. To publish docs, restore the `docgen-action` step together with the `pages: write`
# and `id-token: write` permissions, and enable Pages.
